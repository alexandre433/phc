[package]
name = "phc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The PHC compiler and CLI"

[[bin]]
name = "phc"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
phc-interp = { path = "../crates/phc-interp" }
phc-parser = { path = "../crates/phc-parser" }
phc-semantic = { path = "../crates/phc-semantic" }
phc-typecheck = { path = "../crates/phc-typecheck" }
phc-span = { path = "../crates/phc-span" }
